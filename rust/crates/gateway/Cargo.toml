[package]
name = "ghostr-gateway"
version = "0.1.0"
edition = "2021"
description = "Local HTTP gateway serving progressive and HLS playback, plus the debug web dashboard."

[features]
video-debug-web = ["ghostr-delivery/video-debug-web"]

[dependencies]
ghostr-delivery = { path = "../delivery" }
ghostr-engine = { path = "../engine" }
ghostr-hls-manifest = { path = "../hls-manifest" }
ghostr-media-model = { path = "../media-model" }
ghostr-media-store = { path = "../media-store" }
ghostr-net = { path = "../net" }
ghostr-partial-store = { path = "../partial-store" }

anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
hmac = { workspace = true }
log = { workspace = true }
nostr-sdk = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }

# `tower::ServiceExt::oneshot` drives a route without binding a port; tokio's
# `test-util` lets the session tests expire leases without sleeping. The debug
# router takes a cached Nostr client, so the tests that build one reach for
# `ghostr-discovery` — a test-only edge, not the production one dropped in
# commit 4d400c6.
[dev-dependencies]
ghostr-discovery = { path = "../discovery" }
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true }
