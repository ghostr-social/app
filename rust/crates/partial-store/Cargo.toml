[package]
name = "ghostr-partial-store"
version = "0.1.0"
edition = "2021"
publish = false
autotests = false
description = "Sparse on-disk store of partially downloaded byte ranges, with free-space-aware capacity and LRU eviction."

[features]
test = []

[dependencies]
ghostr-engine = { path = "../engine" }

anyhow = { workspace = true }
fs2 = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }

# `start_paused` and `time::advance`, for driving eviction and refusal timing
# without sleeping.
[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true }
