[package]
name = "ghostr-delivery"
version = "0.1.0"
edition = "2021"
description = "Delivery scheduling and chunk transfer for the media engine."

[features]
video-debug-web = []

[dependencies]
ghostr-engine = { path = "../engine" }
ghostr-net = { path = "../net" }
ghostr-partial-store = { path = "../partial-store" }

anyhow = { workspace = true }
bytes = { workspace = true }
log = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }

# `range_fixture` serves real ranged responses over a loopback listener, so the
# chunk downloader and probes are exercised against an actual HTTP origin.
[dev-dependencies]
axum = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
