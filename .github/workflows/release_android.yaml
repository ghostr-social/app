name: Build and Publish Android App

on:
  # Build on push to main and PRs (as before).
  # ALSO build/publish if a tag is pushed that starts with "v".
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: write

# Serialize runs per ref so consecutive pushes to main compute and
# publish strictly increasing release tags.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────
  #  0) Compute the release tag this run will build and publish
  # ─────────────────────────────────────────────────────────────────
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Check out code with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute release tag
        id: tag
        run: echo "tag=$(sh tool/next_release_tag.sh "$GITHUB_REF")" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────
  #  1) Build Android App for arm64-v8a
  # ─────────────────────────────────────────────────────────────────
  build-android-arm64:
    runs-on: ubuntu-latest
    needs: version
    outputs:
      apk_name: android-apk-arm64-v8a

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            wget \
            curl \
            unzip \
            nasm \
            yasm \
            pkg-config

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 33

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Find installed NDK
        id: find-ndk
        run: |
          echo "Installed NDKs at: $ANDROID_SDK_ROOT/ndk"
          ls -1 "$ANDROID_SDK_ROOT/ndk" || true
          NDK_PATH="$(ls -d $ANDROID_SDK_ROOT/ndk/* | sort -V | tail -n1)"
          echo "NDK_PATH=$NDK_PATH" >> $GITHUB_ENV

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Rust stable
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Add Android Rust targets
        run: rustup target add aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: "[Optional] Configure bindgen for arm64-v8a"
        run: |
          echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--sysroot=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot --target=aarch64-linux-android21" >> $GITHUB_ENV

      - name: Build FFmpeg for arm64-v8a
        run: |
          export NDK="$NDK_PATH"
          bash scripts/build_ffmpeg_on_linux_for_android.sh "$PWD/3rd-party/ffmpeg-libs" arm64-v8a

      - name: Build Rust library for arm64-v8a
        run: |
          export FFMPEG_LIBS_PATH="${GITHUB_WORKSPACE}/3rd-party/ffmpeg-libs"
          cd rust && cargo ndk -t arm64-v8a build --release --target aarch64-linux-android && cd ..

      - name: Derive build version from release tag
        run: sh tool/android_build_version.sh "refs/tags/${{ needs.version.outputs.tag }}" >> "$GITHUB_ENV"

      - name: Build Flutter APK for arm64-v8a
        run: |
          flutter pub get
          FFMPEG_LIBS_PATH="${GITHUB_WORKSPACE}/3rd-party/ffmpeg-libs" flutter build apk --release --target-platform android-arm64 --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"

      - name: Upload build artifacts (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-arm64-v8a
          path: build/app/outputs/flutter-apk/**/*.apk

  # ─────────────────────────────────────────────────────────────────
  #  2) Build Android App for armeabi-v7a
  # ─────────────────────────────────────────────────────────────────
  build-android-armeabi-v7a:
    runs-on: ubuntu-latest
    needs: version
    outputs:
      apk_name: android-apk-armeabi-v7a

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            wget \
            curl \
            unzip \
            nasm \
            yasm \
            pkg-config

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 33

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Find installed NDK
        id: find-ndk
        run: |
          echo "Installed NDKs at: $ANDROID_SDK_ROOT/ndk"
          ls -1 "$ANDROID_SDK_ROOT/ndk" || true
          NDK_PATH="$(ls -d $ANDROID_SDK_ROOT/ndk/* | sort -V | tail -n1)"
          echo "NDK_PATH=$NDK_PATH" >> $GITHUB_ENV

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Rust stable
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Add Android Rust targets
        run: rustup target add armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: "[Optional] Configure bindgen for armeabi-v7a"
        run: |
          echo "BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi=--sysroot=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot --target=armv7-linux-androideabi21" >> $GITHUB_ENV

      - name: Build FFmpeg for armeabi-v7a
        run: |
          export NDK="$NDK_PATH"
          bash scripts/build_ffmpeg_on_linux_for_android.sh "$PWD/3rd-party/ffmpeg-libs" armeabi-v7a

      - name: Build Rust library for armeabi-v7a
        run: |
          export FFMPEG_LIBS_PATH="${GITHUB_WORKSPACE}/3rd-party/ffmpeg-libs"
          cd rust && cargo ndk -t armeabi-v7a build --release --target armv7-linux-androideabi && cd ..

      - name: Derive build version from release tag
        run: sh tool/android_build_version.sh "refs/tags/${{ needs.version.outputs.tag }}" >> "$GITHUB_ENV"

      - name: Build Flutter APK for armeabi-v7a
        run: |
          flutter pub get
          FFMPEG_LIBS_PATH="${GITHUB_WORKSPACE}/3rd-party/ffmpeg-libs" flutter build apk --release --target-platform android-arm --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"

      - name: Upload build artifacts (armeabi-v7a)
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-armeabi-v7a
          path: build/app/outputs/flutter-apk/**/*.apk

  # ─────────────────────────────────────────────────────────────────
  #  3) Build Android App for x86_64
  # ─────────────────────────────────────────────────────────────────
  build-android-x86_64:
    runs-on: ubuntu-latest
    needs: version
    outputs:
      apk_name: android-apk-x86_64

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            wget \
            curl \
            unzip \
            nasm \
            yasm \
            pkg-config

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 33

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Find installed NDK
        id: find-ndk
        run: |
          echo "Installed NDKs at: $ANDROID_SDK_ROOT/ndk"
          ls -1 "$ANDROID_SDK_ROOT/ndk" || true
          NDK_PATH="$(ls -d $ANDROID_SDK_ROOT/ndk/* | sort -V | tail -n1)"
          echo "NDK_PATH=$NDK_PATH" >> $GITHUB_ENV

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Rust stable
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Add Android Rust targets
        run: rustup target add x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: "[Optional] Configure bindgen for x86_64"
        run: |
          echo "BINDGEN_EXTRA_CLANG_ARGS_x86_64_linux_android=--sysroot=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot --target=x86_64-linux-android21" >> $GITHUB_ENV

      - name: Build FFmpeg for x86_64
        run: |
          export NDK="$NDK_PATH"
          bash scripts/build_ffmpeg_on_linux_for_android.sh "$PWD/3rd-party/ffmpeg-libs" x86_64

      - name: Build Rust library for x86_64
        run: |
          export FFMPEG_LIBS_PATH="${GITHUB_WORKSPACE}/3rd-party/ffmpeg-libs"
          cd rust && cargo ndk -t x86_64 build --release --target x86_64-linux-android && cd ..

      - name: Derive build version from release tag
        run: sh tool/android_build_version.sh "refs/tags/${{ needs.version.outputs.tag }}" >> "$GITHUB_ENV"

      - name: Build Flutter APK for x86_64
        run: |
          flutter pub get
          FFMPEG_LIBS_PATH="${GITHUB_WORKSPACE}/3rd-party/ffmpeg-libs" flutter build apk --release --target-platform android-x64 --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"

      - name: Upload build artifacts (x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-x86_64
          path: build/app/outputs/flutter-apk/**/*.apk

  # ─────────────────────────────────────────────────────────────────
  #  4) Create Release and attach APKs
  # ─────────────────────────────────────────────────────────────────
  publish:
    name: Publish Release
    runs-on: ubuntu-latest

    needs:
      - version
      - build-android-arm64
      - build-android-armeabi-v7a
      - build-android-x86_64

    # Publish for tag pushes and for every green push to main, which
    # releases under the freshly computed tag.
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       github.ref == 'refs/heads/main')

    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}

    steps:
      - name: Check out release tooling
        uses: actions/checkout@v4

      - name: Download arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk-arm64-v8a
          path: dist/arm64-v8a

      - name: Download armeabi-v7a artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk-armeabi-v7a
          path: dist/armeabi-v7a

      - name: Download x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk-x86_64
          path: dist/x86_64

      #  Debug step
      - name: List downloaded files
        run: find dist -type f

      - name: Prepare uniquely named APK assets
        run: |
          mkdir -p release-assets
          cp dist/arm64-v8a/app-release.apk \
            "release-assets/ghostr-${RELEASE_TAG}-arm64-v8a.apk"
          cp dist/armeabi-v7a/app-release.apk \
            "release-assets/ghostr-${RELEASE_TAG}-armeabi-v7a.apk"
          cp dist/x86_64/app-release.apk \
            "release-assets/ghostr-${RELEASE_TAG}-x86_64.apk"

      - name: Publish APK release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          sh tool/publish_android_release.sh \
            "$RELEASE_TAG" \
            "release-assets/ghostr-${RELEASE_TAG}-arm64-v8a.apk" \
            "release-assets/ghostr-${RELEASE_TAG}-armeabi-v7a.apk" \
            "release-assets/ghostr-${RELEASE_TAG}-x86_64.apk" \
            "$GITHUB_SHA"
