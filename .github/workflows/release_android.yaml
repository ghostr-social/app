name: Build and Publish Android App

on:
  # Build on push to main and PRs (as before).
  # ALSO build/publish if a tag is pushed that starts with "v".
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: read

# Serialize every publishing push, including main and explicit tag refs, so
# version selection and immutable release publication cannot race. PR checks
# retain per-ref concurrency and never block a release.
concurrency:
  group: >-
    ${{ github.event_name == 'push'
        && 'android-release-publisher'
        || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────
  #  0) Compute the release tag this run will build and publish
  # ─────────────────────────────────────────────────────────────────
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Check out code with tags
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute release tag
        id: tag
        run: echo "tag=$(sh tool/next_release_tag.sh "$GITHUB_REF")" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify Flutter quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Test with coverage
        run: make test-coverage

      - name: Enforce coverage
        run: make coverage-summary

  # ─────────────────────────────────────────────────────────────────
  #  1) Build Android App for arm64-v8a
  # ─────────────────────────────────────────────────────────────────
  build-android-arm64:
    runs-on: ubuntu-latest
    needs: [version, verify]
    outputs:
      apk_name: android-apk-arm64-v8a

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            wget \
            curl \
            unzip \
            nasm \
            yasm \
            pkg-config

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 33

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Find installed NDK
        id: find-ndk
        run: |
          echo "Installed NDKs at: $ANDROID_SDK_ROOT/ndk"
          find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d -print
          NDK_PATH="$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d -print | sort -V | tail -n1)"
          echo "NDK_PATH=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add Android Rust targets
        run: rustup target add aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: "[Optional] Configure bindgen for arm64-v8a"
        run: |
          echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--sysroot=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot --target=aarch64-linux-android21" >> "$GITHUB_ENV"

      - name: Build FFmpeg for arm64-v8a
        run: |
          export NDK="$NDK_PATH"
          bash scripts/build_ffmpeg_on_linux_for_android.sh "$PWD/3rd-party/ffmpeg-libs" arm64-v8a

      - name: Build Rust library for arm64-v8a
        run: |
          export FFMPEG_LIBS_PATH="${GITHUB_WORKSPACE}/3rd-party/ffmpeg-libs"
          cd rust && cargo ndk -t arm64-v8a build --release --target aarch64-linux-android && cd ..

      - name: Derive build version from release tag
        run: sh tool/android_build_version.sh "refs/tags/${{ needs.version.outputs.tag }}" >> "$GITHUB_ENV"

      - name: Set up release signing
        if: github.event_name == 'push'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: sh tool/setup_android_signing.sh

      - name: Build Flutter APK for arm64-v8a
        run: |
          flutter pub get
          FFMPEG_LIBS_PATH="${GITHUB_WORKSPACE}/3rd-party/ffmpeg-libs" flutter build apk --release --target-platform android-arm64 --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"

      - name: Upload build artifacts (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-arm64-v8a
          path: build/app/outputs/flutter-apk/**/*.apk

  # ─────────────────────────────────────────────────────────────────
  #  2) Build Android App for armeabi-v7a
  # ─────────────────────────────────────────────────────────────────
  build-android-armeabi-v7a:
    runs-on: ubuntu-latest
    needs: [version, verify]
    outputs:
      apk_name: android-apk-armeabi-v7a

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            wget \
            curl \
            unzip \
            nasm \
            yasm \
            pkg-config

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 33

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Find installed NDK
        id: find-ndk
        run: |
          echo "Installed NDKs at: $ANDROID_SDK_ROOT/ndk"
          find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d -print
          NDK_PATH="$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d -print | sort -V | tail -n1)"
          echo "NDK_PATH=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add Android Rust targets
        run: rustup target add armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: "[Optional] Configure bindgen for armeabi-v7a"
        run: |
          echo "BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi=--sysroot=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot --target=armv7-linux-androideabi21" >> "$GITHUB_ENV"

      - name: Build FFmpeg for armeabi-v7a
        run: |
          export NDK="$NDK_PATH"
          bash scripts/build_ffmpeg_on_linux_for_android.sh "$PWD/3rd-party/ffmpeg-libs" armeabi-v7a

      - name: Build Rust library for armeabi-v7a
        run: |
          export FFMPEG_LIBS_PATH="${GITHUB_WORKSPACE}/3rd-party/ffmpeg-libs"
          cd rust && cargo ndk -t armeabi-v7a build --release --target armv7-linux-androideabi && cd ..

      - name: Derive build version from release tag
        run: sh tool/android_build_version.sh "refs/tags/${{ needs.version.outputs.tag }}" >> "$GITHUB_ENV"

      - name: Set up release signing
        if: github.event_name == 'push'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: sh tool/setup_android_signing.sh

      - name: Build Flutter APK for armeabi-v7a
        run: |
          flutter pub get
          FFMPEG_LIBS_PATH="${GITHUB_WORKSPACE}/3rd-party/ffmpeg-libs" flutter build apk --release --target-platform android-arm --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"

      - name: Upload build artifacts (armeabi-v7a)
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-armeabi-v7a
          path: build/app/outputs/flutter-apk/**/*.apk

  # ─────────────────────────────────────────────────────────────────
  #  3) Build Android App for x86_64
  # ─────────────────────────────────────────────────────────────────
  build-android-x86_64:
    runs-on: ubuntu-latest
    needs: [version, verify]
    outputs:
      apk_name: android-apk-x86_64

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            wget \
            curl \
            unzip \
            nasm \
            yasm \
            pkg-config

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 33

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Find installed NDK
        id: find-ndk
        run: |
          echo "Installed NDKs at: $ANDROID_SDK_ROOT/ndk"
          find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d -print
          NDK_PATH="$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d -print | sort -V | tail -n1)"
          echo "NDK_PATH=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add Android Rust targets
        run: rustup target add x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: "[Optional] Configure bindgen for x86_64"
        run: |
          echo "BINDGEN_EXTRA_CLANG_ARGS_x86_64_linux_android=--sysroot=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot --target=x86_64-linux-android21" >> "$GITHUB_ENV"

      - name: Build FFmpeg for x86_64
        run: |
          export NDK="$NDK_PATH"
          bash scripts/build_ffmpeg_on_linux_for_android.sh "$PWD/3rd-party/ffmpeg-libs" x86_64

      - name: Build Rust library for x86_64
        run: |
          export FFMPEG_LIBS_PATH="${GITHUB_WORKSPACE}/3rd-party/ffmpeg-libs"
          cd rust && cargo ndk -t x86_64 build --release --target x86_64-linux-android && cd ..

      - name: Derive build version from release tag
        run: sh tool/android_build_version.sh "refs/tags/${{ needs.version.outputs.tag }}" >> "$GITHUB_ENV"

      - name: Set up release signing
        if: github.event_name == 'push'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: sh tool/setup_android_signing.sh

      - name: Build Flutter APK for x86_64
        run: |
          flutter pub get
          FFMPEG_LIBS_PATH="${GITHUB_WORKSPACE}/3rd-party/ffmpeg-libs" flutter build apk --release --target-platform android-x64 --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"

      - name: Upload build artifacts (x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-x86_64
          path: build/app/outputs/flutter-apk/**/*.apk

  # ─────────────────────────────────────────────────────────────────
  #  4) Create Release and attach APKs
  # ─────────────────────────────────────────────────────────────────
  publish:
    name: Publish Release
    permissions:
      contents: write
    runs-on: ubuntu-latest

    needs:
      - version
      - build-android-arm64
      - build-android-armeabi-v7a
      - build-android-x86_64

    # Publish for tag pushes and for every green push to main, which
    # releases under the freshly computed tag.
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       github.ref == 'refs/heads/main')

    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}

    steps:
      - name: Check out release tooling
        uses: actions/checkout@v5

      - name: Set up Java for Android APK validation
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK validation tools
        uses: android-actions/setup-android@v3

      - name: Install APK signature verifier
        run: sdkmanager "build-tools;36.0.0"

      - name: Download arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk-arm64-v8a
          path: dist/arm64-v8a

      - name: Download armeabi-v7a artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk-armeabi-v7a
          path: dist/armeabi-v7a

      - name: Download x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk-x86_64
          path: dist/x86_64

      #  Debug step
      - name: List downloaded files
        run: find dist -type f

      - name: Prepare uniquely named APK assets
        run: |
          mkdir -p release-assets
          cp dist/arm64-v8a/app-release.apk \
            "release-assets/ghostr-${RELEASE_TAG}-arm64-v8a.apk"
          cp dist/armeabi-v7a/app-release.apk \
            "release-assets/ghostr-${RELEASE_TAG}-armeabi-v7a.apk"
          cp dist/x86_64/app-release.apk \
            "release-assets/ghostr-${RELEASE_TAG}-x86_64.apk"

      - name: Derive expected APK version
        run: sh tool/android_build_version.sh "refs/tags/$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Validate signed update APK assets
        run: |
          sh tool/check_android_update_apk.sh \
            "release-assets/ghostr-${RELEASE_TAG}-arm64-v8a.apk" \
            arm64-v8a \
            "$BUILD_NAME" "$BUILD_NUMBER"
          sh tool/check_android_update_apk.sh \
            "release-assets/ghostr-${RELEASE_TAG}-armeabi-v7a.apk" \
            armeabi-v7a \
            "$BUILD_NAME" "$BUILD_NUMBER"
          sh tool/check_android_update_apk.sh \
            "release-assets/ghostr-${RELEASE_TAG}-x86_64.apk" \
            x86_64 \
            "$BUILD_NAME" "$BUILD_NUMBER"

      - name: Generate stable update metadata
        run: |
          sh tool/generate_android_update_manifest.sh \
            "$RELEASE_TAG" \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            "release-assets/ghostr-${RELEASE_TAG}-arm64-v8a.apk" \
            "release-assets/ghostr-${RELEASE_TAG}-armeabi-v7a.apk" \
            "release-assets/ghostr-${RELEASE_TAG}-x86_64.apk" \
            > release-assets/stable.json

      - name: Publish APK release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          sh tool/publish_android_release.sh \
            "$RELEASE_TAG" \
            "release-assets/ghostr-${RELEASE_TAG}-arm64-v8a.apk" \
            "release-assets/ghostr-${RELEASE_TAG}-armeabi-v7a.apk" \
            "release-assets/ghostr-${RELEASE_TAG}-x86_64.apk" \
            "release-assets/stable.json" \
            "$GITHUB_SHA"

  sync-update-site:
    name: Sync app-facing update catalog
    needs: [version, publish]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}

    steps:
      - name: Check out update-site tooling
        uses: actions/checkout@v5

      - name: Download released stable metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern stable.json \
            --dir release-assets

      - name: Publish and verify app-facing update catalog
        env:
          GH_TOKEN: ${{ secrets.UPDATE_SITE_TOKEN }}
        run: sh tool/sync_android_update_site.sh "$RELEASE_TAG" release-assets/stable.json
