plugins {
    id "com.android.application"
    id "kotlin-android"
    id "jacoco"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream ->
        keystoreProperties.load(stream)
    }
}

def androidAbiByFlutterTarget = [
    "android-arm": "armeabi-v7a",
    "android-arm64": "arm64-v8a",
    "android-x86": "x86",
    "android-x64": "x86_64",
]
def flutterTargetPlatforms = project.findProperty("target-platform")
    ?.toString()
    ?.split(",")
    ?.findAll { !it.isBlank() } ?: []
def selectedAndroidAbis = flutterTargetPlatforms
    .collect { androidAbiByFlutterTarget[it] }
    .findAll { it != null }

android {
    namespace = "app.ghostr"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "app.ghostr"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        if (!selectedAndroidAbis.isEmpty()) {
            ndk {
                abiFilters.clear()
                abiFilters.addAll(selectedAndroidAbis)
            }
        }
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        configureEach {
            if (!selectedAndroidAbis.isEmpty()) {
                ndk {
                    abiFilters.clear()
                    abiFilters.addAll(selectedAndroidAbis)
                }
            }
        }
        release {
            // Installed apps reject updates whose signing certificate changed, so
            // published builds must always use the stable key from key.properties.
            // The debug fallback only exists so `flutter run --release` works on
            // machines without the keystore.
            signingConfig = keystorePropertiesFile.exists()
                ? signingConfigs.release
                : signingConfigs.debug
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.16"
}

jacoco {
    toolVersion = "0.8.13"
}

tasks.withType(Test).configureEach {
    jacoco.includeNoLocationClasses = true
    jacoco.excludes = ["jdk.internal.*"]
}

def incomingVideoShareExecutionData = file(
    "$buildDir/jacoco/testDebugUnitTest.exec",
)
def incomingVideoShareClasses = fileTree("$buildDir/tmp/kotlin-classes/debug") {
    include "app/ghostr/IncomingVideoShare*.class"
    include "app/ghostr/CapturedIncomingVideoIntent.class"
}

tasks.register("incomingVideoShareCoverageReport", JacocoReport) {
    dependsOn "testDebugUnitTest"
    executionData.from(incomingVideoShareExecutionData)
    sourceDirectories.from(files("src/main/kotlin"))
    classDirectories.from(incomingVideoShareClasses)
    reports {
        html.required = true
        xml.required = true
    }
}

tasks.register("incomingVideoShareCoverageCheck", JacocoCoverageVerification) {
    dependsOn "incomingVideoShareCoverageReport"
    executionData.from(incomingVideoShareExecutionData)
    sourceDirectories.from(files("src/main/kotlin"))
    classDirectories.from(incomingVideoShareClasses)
    violationRules {
        rule {
            element = "SOURCEFILE"
            limit {
                counter = "LINE"
                value = "COVEREDRATIO"
                minimum = 0.95
            }
        }
    }
}

flutter {
    source = "../.."
}
