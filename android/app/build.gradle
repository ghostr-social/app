plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def androidAbiByFlutterTarget = [
    "android-arm": "armeabi-v7a",
    "android-arm64": "arm64-v8a",
    "android-x86": "x86",
    "android-x64": "x86_64",
]
def flutterTargetPlatforms = project.findProperty("target-platform")
    ?.toString()
    ?.split(",")
    ?.findAll { !it.isBlank() } ?: []
def selectedAndroidAbis = flutterTargetPlatforms
    .collect { androidAbiByFlutterTarget[it] }
    .findAll { it != null }

android {
    namespace = "app.ghostr"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "app.ghostr"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        if (!selectedAndroidAbis.isEmpty()) {
            ndk {
                abiFilters.clear()
                abiFilters.addAll(selectedAndroidAbis)
            }
        }
    }

    buildTypes {
        configureEach {
            if (!selectedAndroidAbis.isEmpty()) {
                ndk {
                    abiFilters.clear()
                    abiFilters.addAll(selectedAndroidAbis)
                }
            }
        }
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
